[project]
name = "event-archive-api"
version = "0.1.0"
description = "A searchable archive for plant events and alarms: Persian-aware full-text search (SQLite FTS5), voice-note transcription with a pluggable mock engine, and a hash-chained audit trail. Fictional plant data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["starlette>=1.0,<2", "uvicorn>=0.30", "pydantic>=2.6,<3"]

[project.scripts]
event-archive = "event_archive.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long literal lines (SQL, Persian sample text)
