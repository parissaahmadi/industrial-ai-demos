[project]
name = "forward-only-migrator"
version = "0.1.0"
description = "A tiny forward-only SQL migration runner for SQLite: SHA-256 checksums, drift / out-of-order detection, one transaction per migration, a least-privilege execution policy, and concurrent-runner safety. Fictional plant data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fwd-migrate = "fwd_migrator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fwd_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long literal SQL lines
