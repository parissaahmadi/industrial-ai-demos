[project]
name = "vibration-anomaly-detection"
version = "0.1.0"
description = "Explainable anomaly detection on (synthetic) vibration windows: robust baselines, persistence and CUSUM, with an honest evaluation including where it fails. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
vibration-anomaly = "vibration_anomaly.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibration_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "RUF001"]
