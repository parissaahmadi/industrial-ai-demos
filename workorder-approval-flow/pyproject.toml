[project]
name = "workorder-approval-flow"
version = "0.1.0"
description = "A three-role (submitter / reviewer / supervisor) approval workflow for maintenance work requests: HTTP API, SQLite, four-eyes rule, optimistic concurrency, idempotent creates and an append-only audit trail. Fictional plant data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["starlette>=1.0,<2", "uvicorn>=0.30", "pydantic>=2.6,<3"]

[project.scripts]
workorder-flow = "workorder_flow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workorder_flow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # a few long literal lines (SQL, schemas)
