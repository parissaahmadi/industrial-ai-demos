[project]
name = "livekit-token-service"
version = "0.1.0"
description = "A small service that issues short-lived LiveKit access tokens for remote-assistance sessions, with role-based grants, rate limiting and an audit trail. Fictional plant data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["starlette>=1.0,<2", "uvicorn>=0.30", "pydantic>=2.6,<3"]

[project.scripts]
livekit-tokens = "livekit_tokens.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_tokens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
